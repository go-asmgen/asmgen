name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Go is pinned to the go.mod floor, 1.27.1: the arm64 vector-float mnemonics
# need Go 1.27, and RISC-V Vector / LoongArch LSX need 1.25. A pinned version
# is what lets Renovate propose the next one for review instead of the
# toolchain moving with no commit. goasm-gaps.yml alone follows `stable`,
# because its question is what the newest release can assemble.
jobs:
  # The library (shared ABI0 model + per-arch builders + ISA-agnostic emit) is
  # ordinary architecture-independent Go: it builds and is coverage-gated
  # everywhere. The generated assembly is NOT exercised here — that is the
  # asm-<arch> jobs.
  lib:
    name: lib (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      - name: Show Go version
        run: go version

      - name: Vet
        run: go vet ./abi/... ./emit/... ./amd64/... ./arm64/... ./riscv64/... ./loong64/... ./ppc64/... ./s390x/... ./fft/... ./wasm/...

      - name: Build
        run: go build ./abi/... ./emit/... ./amd64/... ./arm64/... ./riscv64/... ./loong64/... ./ppc64/... ./s390x/... ./fft/... ./wasm/...

      - name: gofmt
        if: runner.os == 'Linux'
        # With Go pinned, gofmt's rules change only in a reviewed bump, so
        # this cannot turn red on its own.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "::error::not gofmt-formatted:"; echo "$unformatted"; exit 1; fi

      - name: Test + 100% coverage gate
        shell: bash
        run: |
          go test -race -coverprofile=cover.out ./abi/... ./emit/... ./amd64/... ./arm64/... ./riscv64/... ./loong64/... ./ppc64/... ./s390x/... ./fft/... ./wasm/... ./internal/...
          go tool cover -func=cover.out | tee cover.txt
          # Org-wide hard rule: the library is held to 100% statement coverage.
          # Every branch must be reachable from a test or the dead code is
          # removed — the bar is never lowered. The example packages carry no
          # statements (they are generated-asm integration checks, see asm-*).
          cov=$(go tool cover -func=cover.out | tail -n 1 | awk '{print $3}' | tr -d '%')
          echo "library coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::library coverage ${cov}% < 100%"; exit 1; }

      - name: Test tools
        shell: bash
        # goasmgap drives the Go assembler for every target, so it is tested
        # here too, but it is a command, not library code: outside the gate.
        run: go test ./tools/...

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cover-${{ matrix.os }}
          path: cover.out
          if-no-files-found: warn

  # Known vulnerabilities in the code the library and tools reach (the module has
  # no dependencies, so this watches the standard library of the Go in use).
  security:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./abi/... ./emit/... ./amd64/... ./arm64/... ./riscv64/... ./loong64/... ./ppc64/... ./s390x/... ./fft/... ./wasm/... ./internal/... ./tools/...

  # amd64 is the easy target: the GitHub-hosted ubuntu runner is amd64, so the
  # generated assembly (scalar + SSE SIMD) runs natively — no qemu.
  asm-amd64:
    name: asm-amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      - name: Confirm amd64
        run: go env GOARCH GOHOSTARCH

      - name: Regenerate assembly and check it is committed
        run: |
          go generate ./examples/amd64/... ./examples/simd/amd64/... ./examples/loop/amd64/... ./examples/fft/amd64/...
          git diff --exit-code -- examples/amd64 examples/simd/amd64 examples/loop/amd64 examples/fft/amd64 || {
            echo "::error::generated amd64 assembly is stale; run go generate and commit"; exit 1; }

      - name: Vet (asmdecl)
        run: go vet ./examples/amd64/... ./examples/simd/amd64/... ./examples/loop/amd64/... ./examples/fft/amd64/...

      - name: Build
        run: go build ./examples/amd64/... ./examples/simd/amd64/... ./examples/loop/amd64/... ./examples/fft/amd64/...

      - name: Test (runtime correctness on native amd64, incl. SSE SIMD)
        run: go test ./examples/amd64/... ./examples/simd/amd64/... ./examples/loop/amd64/... ./examples/fft/amd64/...

  # The whole point of go-asmgen is the emitted Plan 9 assembly. That can only
  # be validated where it runs, so this job is arm64-native: it regenerates the
  # .s, checks it matches what is committed, runs `go vet` (asmdecl cross-checks
  # every name+offset(FP) against the Go declaration), builds, and runs the
  # function for real (scalars, aggregates, arrays, NEON SIMD).
  asm-arm64:
    name: asm-arm64 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      - name: Confirm arm64
        run: go env GOARCH GOHOSTARCH

      - name: Regenerate assembly and check it is committed
        run: |
          go generate ./examples/add/... ./examples/types/... ./examples/aggregate/... ./examples/simd/arm64/... ./examples/array/arm64/... ./examples/frame/arm64/... ./examples/loop/arm64/... ./examples/fft/arm64/...
          git diff --exit-code -- examples/add examples/types examples/aggregate examples/simd/arm64 examples/array/arm64 examples/frame/arm64 examples/loop/arm64 examples/fft/arm64 || {
            echo "::error::generated arm64 assembly is stale; run go generate and commit"; exit 1; }

      - name: Vet (asmdecl)
        run: go vet ./examples/add/... ./examples/types/... ./examples/aggregate/... ./examples/simd/arm64/... ./examples/array/arm64/... ./examples/frame/arm64/... ./examples/loop/arm64/... ./examples/fft/arm64/...

      - name: Build
        run: go build ./examples/add/... ./examples/types/... ./examples/aggregate/... ./examples/simd/arm64/... ./examples/array/arm64/... ./examples/frame/arm64/... ./examples/loop/arm64/... ./examples/fft/arm64/...

      - name: Test (runtime correctness on native arm64, incl. NEON SIMD)
        run: go test ./examples/add/... ./examples/types/... ./examples/aggregate/... ./examples/simd/arm64/... ./examples/array/arm64/... ./examples/frame/arm64/... ./examples/loop/arm64/... ./examples/fft/arm64/...

  # riscv64 has no GitHub-hosted runner, so this job cross-compiles on amd64 and
  # runs the generated assembly under qemu-user. asmdecl and cmd/asm validate
  # offsets and mnemonics statically (including RVV); qemu provides the runtime
  # proof. The SIMD runtime is a separate step that enables the vector CPU.
  asm-riscv64:
    name: asm-riscv64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between
      # its two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers
      # binfmt handlers, it does not ship the `qemu-<arch>-static` binaries this
      # lane invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # here. go-tex/engine#645 has the full account.
      #
      # This job tests ONE architecture, so the emulator is resolved once and
      # carried to the test steps in $GITHUB_ENV: two resolvers in two steps are
      # two chances to disagree.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
          q=""
          for cand in qemu-riscv64-static qemu-riscv64; do
            command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
          done
          # ⛔ A missing emulator FAILS this job. A lane that reports success for
          # an architecture it never ran is the one outcome these jobs exist to
          # rule out -- and the runtime proof is the whole point here, since
          # asmdecl and cmd/asm already validate statically.
          if [ -z "$q" ]; then
            echo "::error::no qemu user emulator for riscv64 (looked for qemu-riscv64-static and qemu-riscv64)" >&2
            exit 1
          fi
          echo "QEMU_EXEC=$q" >> "$GITHUB_ENV"

      - name: Regenerate assembly and check it is committed
        run: |
          go generate ./examples/riscv64/... ./examples/simd/riscv64/... ./examples/loop/riscv64/... ./examples/fft/riscv64/...
          git diff --exit-code -- examples/riscv64 examples/simd/riscv64 examples/loop/riscv64 examples/fft/riscv64 || {
            echo "::error::generated riscv64 assembly is stale; run go generate and commit"; exit 1; }

      - name: Vet (asmdecl)
        run: GOOS=linux GOARCH=riscv64 go vet ./examples/riscv64/... ./examples/simd/riscv64/... ./examples/loop/riscv64/... ./examples/fft/riscv64/...

      - name: Build (cmd/asm validates mnemonics, incl. RVV)
        run: GOOS=linux GOARCH=riscv64 go build ./examples/riscv64/... ./examples/simd/riscv64/... ./examples/loop/riscv64/... ./examples/fft/riscv64/...

      - name: Test scalar (runtime under qemu-riscv64)
        # Printed on purpose: without it, "ran under emulation" and "skipped"
        # are indistinguishable from a green tick.
        run: |
          echo "running riscv64 under $QEMU_EXEC"
          GOARCH=riscv64 go test -exec "$QEMU_EXEC" ./examples/riscv64/...

      - name: Test RVV SIMD (runtime under qemu with vectors)
        env:
          QEMU_CPU: rv64,v=true,vlen=128
        run: |
          echo "running riscv64 under $QEMU_EXEC"
          GOARCH=riscv64 go test -exec "$QEMU_EXEC" ./examples/simd/riscv64/... ./examples/loop/riscv64/... ./examples/fft/riscv64/...

  # loong64 (LoongArch 64-bit) follows the same recipe as riscv64.
  asm-loong64:
    name: asm-loong64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      # ⛔ See asm-riscv64 above: `qemu-user-static` is a VIRTUAL package on
      # Ubuntu 26.04 with no installation candidate, and a provider alone does
      # not ship the emulator binaries. ⚠ loong64's GOARCH and its qemu binary
      # name DIFFER -- the emulator is `qemu-loongarch64`, not `qemu-loong64`.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
          q=""
          for cand in qemu-loongarch64-static qemu-loongarch64; do
            command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
          done
          if [ -z "$q" ]; then
            echo "::error::no qemu user emulator for loong64 (looked for qemu-loongarch64-static and qemu-loongarch64)" >&2
            exit 1
          fi
          echo "QEMU_EXEC=$q" >> "$GITHUB_ENV"

      - name: Regenerate assembly and check it is committed
        run: |
          go generate ./examples/loong64/... ./examples/simd/loong64/... ./examples/loop/loong64/...
          git diff --exit-code -- examples/loong64 examples/simd/loong64 examples/loop/loong64 || {
            echo "::error::generated loong64 assembly is stale; run go generate and commit"; exit 1; }

      - name: Vet (asmdecl)
        run: GOOS=linux GOARCH=loong64 go vet ./examples/loong64/... ./examples/simd/loong64/... ./examples/loop/loong64/...

      - name: Build (cmd/asm validates mnemonics, incl. LSX)
        run: GOOS=linux GOARCH=loong64 go build ./examples/loong64/... ./examples/simd/loong64/... ./examples/loop/loong64/...

      - name: Test scalar (runtime under qemu-loongarch64)
        run: |
          echo "running loong64 under $QEMU_EXEC"
          GOARCH=loong64 go test -exec "$QEMU_EXEC" ./examples/loong64/...

      - name: Test LSX SIMD (runtime under qemu with vectors)
        env:
          QEMU_CPU: la464
        run: |
          echo "running loong64 under $QEMU_EXEC"
          GOARCH=loong64 go test -exec "$QEMU_EXEC" ./examples/simd/loong64/... ./examples/loop/loong64/...

  # ppc64le (POWER, VSX/AltiVec) — little-endian. VSX is baseline on POWER8+,
  # so the default qemu CPU suffices.
  asm-ppc64le:
    name: asm-ppc64le
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      # ⛔ See asm-riscv64 above: `qemu-user-static` is a VIRTUAL package on
      # Ubuntu 26.04 with no installation candidate, and a provider alone does
      # not ship the emulator binaries.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
          q=""
          for cand in qemu-ppc64le-static qemu-ppc64le; do
            command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
          done
          if [ -z "$q" ]; then
            echo "::error::no qemu user emulator for ppc64le (looked for qemu-ppc64le-static and qemu-ppc64le)" >&2
            exit 1
          fi
          echo "QEMU_EXEC=$q" >> "$GITHUB_ENV"

      - name: Regenerate assembly and check it is committed
        run: |
          go generate ./examples/simd/ppc64/...
          git diff --exit-code -- examples/simd/ppc64 || {
            echo "::error::generated ppc64le assembly is stale; run go generate and commit"; exit 1; }

      - name: Vet (asmdecl)
        run: GOOS=linux GOARCH=ppc64le go vet ./examples/simd/ppc64/...

      - name: Build (cmd/asm validates mnemonics, incl. VSX)
        run: GOOS=linux GOARCH=ppc64le go build ./examples/simd/ppc64/...

      - name: Test VSX SIMD (runtime under qemu-ppc64le)
        run: |
          echo "running ppc64le under $QEMU_EXEC"
          GOARCH=ppc64le go test -exec "$QEMU_EXEC" ./examples/simd/ppc64/...

  # s390x (IBM Z, vector facility) — the only big-endian target. Same recipe;
  # QEMU_CPU=max enables the vector facility.
  asm-s390x:
    name: asm-s390x
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      # ⛔ See asm-riscv64 above: `qemu-user-static` is a VIRTUAL package on
      # Ubuntu 26.04 with no installation candidate, and a provider alone does
      # not ship the emulator binaries.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
          q=""
          for cand in qemu-s390x-static qemu-s390x; do
            command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
          done
          if [ -z "$q" ]; then
            echo "::error::no qemu user emulator for s390x (looked for qemu-s390x-static and qemu-s390x)" >&2
            exit 1
          fi
          echo "QEMU_EXEC=$q" >> "$GITHUB_ENV"

      - name: Regenerate assembly and check it is committed
        run: |
          go generate ./examples/simd/s390x/... ./examples/fft/s390x/...
          git diff --exit-code -- examples/simd/s390x examples/fft/s390x || {
            echo "::error::generated s390x assembly is stale; run go generate and commit"; exit 1; }

      - name: Vet (asmdecl)
        run: GOOS=linux GOARCH=s390x go vet ./examples/simd/s390x/... ./examples/fft/s390x/...

      - name: Build (cmd/asm validates mnemonics, incl. vector facility)
        run: GOOS=linux GOARCH=s390x go build ./examples/simd/s390x/... ./examples/fft/s390x/...

      - name: Test vector SIMD (runtime under qemu-s390x, big-endian)
        env:
          QEMU_CPU: max
        run: |
          echo "running s390x under $QEMU_EXEC"
          GOARCH=s390x go test -exec "$QEMU_EXEC" ./examples/simd/s390x/... ./examples/fft/s390x/...

  # wasm-e2e regenerates each shipped wasm kernel from the pinned generator
  # (./examples/wasm/<kernel>) and drift-gates the committed .wat.golden
  # against the fresh generator output, then compiles via wat2wasm and runs
  # the wazero cross-check in examples/wasm/verify/ against a Go reference.
  # This is the wasm analogue of the asm-<arch> jobs — one runner covers
  # every kernel because wasm-SIMD is arch-agnostic.
  wasm-e2e:
    name: wasm-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      - name: Install WABT (wat2wasm)
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt

      - name: Regenerate + compile + verify each kernel
        run: |
          set -eo pipefail
          cd examples/wasm/verify
          go mod download
          cd ../../..
          for k in matchlen hex hex_decode popcount toupper memchr isascii utf8len json_clean adler32 base64_encode indexany4 base64_decode; do
            echo "::group::$k"
            go run ./examples/wasm/"$k" > "/tmp/$k.wat"
            # Drift gate: freshly-generated .wat must match the golden.
            diff -u "examples/wasm/$k/$k.wat.golden" "/tmp/$k.wat" || {
              echo "::error::golden examples/wasm/$k/$k.wat.golden differs from generator output"
              exit 1
            }
            wat2wasm "/tmp/$k.wat" -o "/tmp/$k.wasm"
            (cd examples/wasm/verify && go run . "$k" "/tmp/$k.wasm")
            echo "::endgroup::"
          done

      # The loop above runs each generator's HAPPY PATH: emit, compile, check
      # the result against a Go reference. These packages also have Go tests,
      # and those reach what the loop cannot --
      #
      #     TestRunMatchesGolden      the same drift gate, from inside
      #     TestRunErrorPropagates    a writer that fails mid-emit
      #     TestMainErrorPath         a bad argument, a non-zero exit
      #
      # -- the error paths, which `go run` on a working input never takes.
      # Thirteen packages' worth of them had never run anywhere: every other
      # example tree is named on its asm-<arch> job's `go test` line, and
      # examples/wasm was the one left out of that pattern.
      - name: go test the wasm example packages
        run: go test ./examples/wasm/...
