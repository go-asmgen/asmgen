name: goasm-gaps

# Watches the instructions go-asmgen encodes as WORDs because cmd/asm lacks
# them (internal/gap): reports when a Go release or master gains one, and
# checks that the patches in goasm-patches/ still apply to master and still
# produce the reference encodings. Scheduled, because Go changes without any
# push here.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "internal/gap/**"
      - "tools/goasmgap/**"
      - "goasm-patches/**"
      - ".github/workflows/goasm-gaps.yml"

# Least privilege: the job that builds Go master and applies patches holds a
# read-only token; only the small report job may write issues.
permissions:
  contents: read

jobs:
  gaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          # Deliberately the channel, not a pinned version: this job's
          # question is what the NEWEST Go release can assemble. ci.yml pins.
          go-version: stable

      - name: Build goasmgap
        run: go build -o "$RUNNER_TEMP/goasmgap" ./tools/goasmgap

      - name: Verify against the latest release
        run: |
          "$RUNNER_TEMP/goasmgap" verify -goroot "$(go env GOROOT)" | tee "$RUNNER_TEMP/release.txt"
          echo "release=$(go env GOVERSION)" >> "$GITHUB_ENV"

      - name: Build Go master
        run: |
          git clone --depth 1 https://go.googlesource.com/go "$RUNNER_TEMP/gomaster"
          cd "$RUNNER_TEMP/gomaster/src"
          GOROOT_BOOTSTRAP="$(go env GOROOT)" ./make.bash
          echo "master=$(cd .. && git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Scan and verify Go master
        run: |
          "$RUNNER_TEMP/goasmgap" scan -goroot "$RUNNER_TEMP/gomaster"
          "$RUNNER_TEMP/goasmgap" verify -goroot "$RUNNER_TEMP/gomaster" | tee "$RUNNER_TEMP/master.txt"
          printf 'release=%s\nmaster=%s\n' "$release" "$master" > "$RUNNER_TEMP/versions.txt"

      - name: Keep the verdicts for the report job
        uses: actions/upload-artifact@v7
        with:
          name: verdicts
          path: |
            ${{ runner.temp }}/release.txt
            ${{ runner.temp }}/master.txt
            ${{ runner.temp }}/versions.txt

      - name: Follow the mailed Go CLs
        # A mailed CL is forgotten the same way an unmailed patch is: a
        # reviewer asks something and nobody answers. Record each CL's state
        # for the report job, which opens an issue when one is waiting.
        run: |
          : > "$RUNNER_TEMP/cls.txt"
          grep -vE '^\s*(#|$)' goasm-patches/cls.txt | while read -r cl _; do
            curl -fsS "https://go-review.googlesource.com/changes/$cl" | tail -c +5 |
              jq -r --arg cl "$cl" '"\($cl)\t\(.status)\t\(.unresolved_comment_count // 0)\t\(.subject)"' >> "$RUNNER_TEMP/cls.txt"
          done
          cat "$RUNNER_TEMP/cls.txt"

      - name: Keep the CL states for the report job
        uses: actions/upload-artifact@v7
        with:
          name: cls
          path: ${{ runner.temp }}/cls.txt

      - name: Apply the patches to master and verify them
        # A mailed CL is applied as its CURRENT patchset on Gerrit, what the
        # reviewers see, not as the local file it started from.
        run: |
          shopt -s nullglob
          dir="$RUNNER_TEMP/patches"; mkdir -p "$dir"
          declare -A mailed
          while read -r cl patch; do
            mailed[$patch]=1
            curl -fsS "https://go-review.googlesource.com/changes/$cl/revisions/current/patch?download" | base64 -d > "$dir/cl-$cl.patch"
          done < <(grep -vE '^\s*(#|$)' goasm-patches/cls.txt)
          for p in goasm-patches/*.patch; do
            [ -n "${mailed[$(basename "$p")]:-}" ] || cp "$p" "$dir/"
          done
          patches=("$dir"/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then echo "no patches"; exit 0; fi
          cd "$RUNNER_TEMP/gomaster"
          git -c user.name=goasm-gaps -c user.email=goasm-gaps@localhost am "${patches[@]}"
          arches=$(grep -hoE '^Subject: \[PATCH\] cmd/internal/obj/[a-z0-9]+' "${patches[@]}" | sed 's#.*/##' | sort -u)
          # Go's own tests: every line a patch adds to testdata, including
          # instructions and error cases go-asmgen holds no reference for.
          pkgs=(cmd/asm/internal/asm)
          for a in $arches; do pkgs+=("cmd/internal/obj/$a"); done
          GOTOOLCHAIN=local bin/go test "${pkgs[@]}"
          cd "$GITHUB_WORKSPACE"
          # The independent references (verify builds cmd/asm from source).
          for arch in $arches; do
            "$RUNNER_TEMP/goasmgap" verify -goroot "$RUNNER_TEMP/gomaster" -arch "$arch" -require
          done

  # Runs even when a patch no longer applies (the gaps job then fails after
  # saving the verdicts): Go gaining an instruction is news either way.
  report:
    needs: gaps
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: verdicts
          path: ${{ runner.temp }}

      - uses: actions/download-artifact@v7
        with:
          name: cls
          path: ${{ runner.temp }}

      - name: Open an issue when a Go CL is waiting for us
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          waiting=$(awk -F'\t' '$2=="ABANDONED" || ($2=="NEW" && $3>0)' "$RUNNER_TEMP/cls.txt")
          if [ -z "$waiting" ]; then echo "no CL is waiting"; exit 0; fi
          title="Go CLs waiting for a reply"
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            echo "already reported"; exit 0
          fi
          {
            echo "These upstream CLs, mailed from goasm-patches/, need attention (unresolved review comments, or abandoned):"
            echo
            echo "$waiting" | awk -F'\t' '{printf "- https://go.dev/cl/%s  %s, %s unresolved: %s\n", $1, $2, $3, $4}'
          } > "$RUNNER_TEMP/clbody.md"
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/clbody.md"

      - name: Open an issue when Go gains an instruction
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          . "$RUNNER_TEMP/versions.txt"
          news=$( { sed "s/^/$release: /" "$RUNNER_TEMP/release.txt"; sed "s/^/master@$master: /" "$RUNNER_TEMP/master.txt"; } | grep ': SUPPORTED' || true)
          if [ -z "$news" ]; then echo "nothing new"; exit 0; fi
          isas=$(echo "$news" | awk '{print $4}' | sort -u | tr '\n' ' ')
          title="goasm gap closed upstream: ${isas% }"
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            echo "already reported: $title"; exit 0
          fi
          fence='```'
          {
            echo "Go now assembles these registry entries for every reference case:"
            echo
            echo "$fence"
            echo "$news"
            echo "$fence"
            echo
            echo "The matching methods can emit the mnemonic instead of a WORD (raising the go directive if only master or a new release has it), and the entry can leave internal/gap."
          } > "$RUNNER_TEMP/body.md"
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"

